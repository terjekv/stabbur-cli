[workspace]
resolver = "3"

[package]
name = "stabbur-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Operational command-line client for Stabbur"
repository = "https://github.com/terjekv/stabbur-cli"
readme = "README.md"

[[bin]]
name = "stabbur"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6"
hex = "0.4"
rpassword = "7.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
stabbur_client = { version = "=0.1.0", path = "../stabbur-client-rust", default-features = false, features = ["blocking"] }
tempfile = "3"
thiserror = "2.0"
uuid = { version = "1.18", features = ["v7"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
